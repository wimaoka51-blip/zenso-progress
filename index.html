<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>課題の進み具合｜ZENSO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@500;600&display=swap">
<style>
/* rokuma の決まり（白い地・墨・細い横線・青は少しだけ）のまま、忙しい人が上の1画面で分かる組み方に。
   上から：3つの数字 → 最新の動き → 見てほしいこと → 作品（＋コメント）→ 残り → 完了 → 指摘 → 動き */
:root{
  --bg:#ffffff; --ink:#111214; --sub:#4f5257; --faint:#6f7276; --line:#e4e4e0; --face:#f3f3f1;
  --accent:#2850b8; --decide:#9a6b1f; --on-ink:#ffffff; --err:#a3412f;
  --jp:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  --num:Poppins,"Noto Sans JP",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141518; --ink:#ececea; --sub:#c2c4c7; --faint:#a3a6aa; --line:#2e3035; --face:#1d1e22;
  --accent:#9db3ee; --decide:#e3b56a; --on-ink:#141518; --err:#e98b78; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding-block:32px 80px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:64px}
.wrap>*{min-width:0}
.num{font-family:var(--num);font-weight:500;font-variant-numeric:tabular-nums}

/* 頭 */
.brand{display:flex;align-items:center;gap:12px;color:var(--sub);font-size:14px}
.brand b{font-family:var(--num);font-weight:600;font-size:15px;letter-spacing:.08em;color:var(--ink)}
.brand span{padding-left:12px;border-left:1px solid var(--line)}
h1{font-size:clamp(24px,4vw,32px);line-height:1.4;margin:14px 0 0;font-weight:700;text-wrap:balance}

/* 3つの数字：ここだけ見れば分かる */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-top:28px}
.stat{padding:18px 20px 20px;border-left:1px solid var(--line);display:grid;gap:2px;align-content:start}
.stat:first-child{border-left:0;padding-left:0}
.stat dt{font-size:14px;color:var(--sub);font-weight:500}
.stat dd{margin:0;font-family:var(--num);font-weight:600;font-size:clamp(34px,6vw,48px);line-height:1.15;letter-spacing:-.01em}
.stat dd small{font-size:.42em;font-weight:500;margin-left:3px;letter-spacing:0}
.stat dd.key{color:var(--accent)}
.stat .note{font-size:13.5px;color:var(--sub)}
.bar-all{height:6px;background:var(--line);margin-top:10px}
.bar-all i{display:block;height:100%;background:var(--accent)}
.latest{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;margin-top:18px;font-size:15.5px}
.latest b{font-size:13px;font-weight:700;color:var(--on-ink);background:var(--ink);padding:1px 8px;letter-spacing:.04em}
.latest span{min-width:0}
.latest.now b{background:var(--accent)}
.latest.now strong{font-weight:700}
.task.is-now{border-top:3px solid var(--accent);margin-top:-1px;padding-top:18px}
.now-tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--on-ink);background:var(--accent);padding:1px 8px;margin-right:10px;vertical-align:2px;letter-spacing:.04em}
.latest .when{color:var(--sub);font-size:14px;margin-right:8px}

/* 見出し：r の肩の四分円 */
h2{font-size:22px;line-height:1.4;margin:0 0 18px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
h2::before{content:"";width:14px;height:14px;border-top-left-radius:14px;background:var(--ink);flex:none}
h2 small{font-size:14px;color:var(--sub);font-weight:500}

/* 見てほしいこと */
.ask{background:var(--face);padding:24px 28px;counter-reset:a}
.ask ol{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.ask li{display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;font-size:17px;font-weight:500}
.ask li::before{counter-increment:a;content:counter(a);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-family:var(--num);font-size:13px;font-weight:600;display:grid;place-content:center;margin-top:1px}

/* 作品 */
.work{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:start}
.work img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--face)}
.work h3{margin:0 0 6px;font-size:26px;font-weight:600;font-family:var(--num);line-height:1.3}
.work .desc{margin:0 0 18px;font-size:15px;color:var(--sub)}
.links{display:grid;border-top:1px solid var(--ink)}
.links a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:8px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:17px}
.links a::after{content:"→";font-family:var(--num);font-weight:500;color:var(--accent);font-size:18px}
.links a:hover{color:var(--accent)}

/* コメント */
.cm{margin-top:24px;display:grid;gap:10px}
.cm label{font-size:15px;font-weight:700}
.cm .hint{font-size:13.5px;color:var(--sub);margin:-6px 0 0}
.cm textarea,.cm input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--faint);border-radius:0;padding:12px 14px}
.cm textarea{min-height:112px;resize:vertical;line-height:1.7}
.cm textarea:focus,.cm input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.cm .row{display:grid;grid-template-columns:1fr auto;gap:10px}
.cm button{font:inherit;font-weight:700;font-size:15px;background:var(--ink);color:var(--on-ink);border:0;padding:0 24px;min-height:50px;cursor:pointer}
.cm button:disabled{opacity:.5;cursor:default}
.cm button:focus-visible,.links a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cm .msg{font-size:14px;margin:0;min-height:1.5em}
.cm .msg.err{color:var(--err)}
.cm .msg.ok{color:var(--ink);font-weight:500}

/* 状態の印（ロゴの形） */
.st{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);font-weight:500;white-space:nowrap}
.mk{width:10px;height:10px;flex:none;display:inline-block}
.mk-完了{border-radius:50%;background:var(--ink)}
.mk-進行中{border-radius:0 0 10px 10px;height:5px;background:var(--ink);margin-top:5px}
.mk-見てほしい{border-radius:50%;background:var(--accent)}
.mk-未着手{border-radius:50%;border:2px solid var(--faint)}
.mk-待ち{border-radius:50%;border:2px solid var(--decide)}

/* 残っている課題 */
.tasks{border-top:1px solid var(--ink)}
.task{padding:20px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.task-top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline}
.task-name{font-weight:700;font-size:18px}
.task-pct{font-size:26px;font-weight:600;line-height:1}
.task-pct small{font-size:13px;margin-left:2px}
.task-desc{font-size:14.5px;color:var(--sub);margin:-2px 0 0}
.bar{height:6px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--ink)}
.task-foot{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;font-size:14px;color:var(--sub)}
details summary{cursor:pointer;color:var(--ink);font-size:14px;font-weight:500;list-style:none;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:4px;width:fit-content}
details summary::-webkit-details-marker{display:none}
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:15px}
.steps li{display:grid;grid-template-columns:20px 1fr;align-items:center}
.steps li.off{color:var(--sub)}
.steps li::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--faint)}
.steps li.on::before{background:var(--ink);border-color:var(--ink)}

.sub-h{font-size:15px;font-weight:700;margin:32px 0 0;color:var(--sub)}
.done-list{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.done-list li{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:6px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.done-list li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.done-list .num{color:var(--sub);font-size:14px}

/* 表 */
.table-box{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{text-align:left;padding:14px 18px 14px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13.5px;color:var(--sub);font-weight:500;border-bottom:1px solid var(--ink)}
td:first-child{font-weight:700}
td:last-child{color:var(--sub)}

/* 動き */
.log{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.log li{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.log time{color:var(--sub);font-size:14px;padding-top:2px}
.log .card{display:block;font-size:14px;color:var(--sub)}
.empty{color:var(--sub);font-size:15px;margin:0}
footer{font-size:13.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:18px}

@media (max-width:640px){
  body{font-size:16px}
  .wrap{gap:52px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid var(--line)}
  .stat:nth-child(2){padding-right:0}
  .work{grid-template-columns:1fr;gap:18px}
  .ask{padding:20px}
  .ask li{font-size:16px}
  .cm .row{grid-template-columns:1fr}
  h2{font-size:20px}
}
@media (prefers-reduced-motion:no-preference){.bar i,.bar-all i{transition:width .6s ease}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <p class="empty">読み込んでいます…</p>
</main>
<script>
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = s => s.length ? Math.round(s.filter(x => x[1]).length / s.length * 100) : 0;
const jst = iso => new Date(new Date(iso).getTime() + 9 * 3600e3);
const md = iso => { const d = jst(iso); return `${d.getUTCMonth()+1}/${d.getUTCDate()}`; };
const WD = "日月火水木金土";

function render(d, site) {
  site = site || {works: []};
  const ms = d.milestones.filter(m => m.due).sort((a,b) => a.due.localeCompare(b.due));
  const today = jst(new Date().toISOString()); today.setUTCHours(0,0,0,0);
  const cur = ms.find(m => jst(m.due) >= today && m.open > 0) || ms[ms.length-1];
  const tasks = d.cards.filter(c => c.milestone === cur.title && c.labels.includes("課題")).sort((a,b) => a.number - b.number);
  const RANK = {"見てほしい":0,"進行中":1,"未着手":2};
  const openTasks = tasks.filter(t => t.status !== "完了").sort((a,b) => (RANK[a.status] ?? 3) - (RANK[b.status] ?? 3) || a.number - b.number);
  const doneTasks = tasks.filter(t => t.status === "完了");
  const fbMs = [...new Set(d.cards.filter(c => c.labels.includes("指摘")).map(c => c.milestone))];
  const fbTitle = fbMs[fbMs.length-1];
  const fb = d.cards.filter(c => c.labels.includes("指摘") && c.milestone === fbTitle).sort((a,b) => a.number - b.number);
  const asks = d.cards.filter(c => c.labels.includes("見てほしい") && c.status !== "完了").flatMap(c => c.bullets);

  const steps = tasks.flatMap(t => t.steps.length ? t.steps : [[t.title, t.status === "完了"]]);
  const total = pct(steps);
  const due = jst(cur.due);
  const days = Math.round((due - today) / 864e5);
  const latest = d.log[0];
  const nowTasks = openTasks.filter(t => t.status === "進行中");
  const st = (s, wait) => `<span class="st"><span class="mk mk-${wait ? "待ち" : s}"></span>${wait ? "待ち" : s}</span>`;
  const cm = site.comment && site.comment.action;

  document.getElementById("app").innerHTML = `
  <header>
    <div class="brand"><b>ZENSO</b><span>課題の進み具合</span></div>
    <h1>${esc(cur.description.replace(/^課題：/, "") || cur.title)}</h1>
    <dl class="stats">
      <div class="stat"><dt>進み具合</dt><dd class="key">${total}<small>%</small></dd>
        <div class="note">手順 <span class="num">${steps.filter(x=>x[1]).length}/${steps.length}</span> 済み</div>
        <div class="bar-all"><i style="width:${total}%"></i></div></div>
      <div class="stat"><dt>残っている課題</dt><dd>${openTasks.length}<small>件</small></dd>
        <div class="note">完了 <span class="num">${doneTasks.length}</span> 件</div></div>
      <div class="stat"><dt>次の面談</dt><dd>${due.getUTCMonth()+1}/${due.getUTCDate()}<small>（${WD[due.getUTCDay()]}）</small></dd>
        <div class="note">${days >= 0 ? `あと <span class="num">${days}</span> 日` : "済み"}</div></div>
    </dl>
    ${nowTasks.length ? `<p class="latest now"><b>いま</b><span><strong>${nowTasks.map(t => esc(t.title)).join("、")}</strong> に取り掛かっています</span></p>` : ""}
    ${latest ? `<p class="latest"><b>最新</b><span><span class="when num">${md(latest.at)}</span>${esc(latest.card)}${latest.text && latest.text !== "完了" ? `：${esc(latest.text)}` : "（完了）"}</span></p>` : ""}
  </header>

  ${asks.length ? `<section>
    <h2>次の面談で見てほしいこと</h2>
    <div class="ask"><ol>${asks.map(a => `<li><span>${esc(a)}</span></li>`).join("")}</ol></div>
  </section>` : ""}

  ${site.works.length ? `<section>
    <h2>できた作品</h2>
    ${site.works.map((w, i) => `<article class="work">
      ${w.image ? `<img src="${esc(w.image)}" alt="${esc(w.title)} のページの写真" loading="lazy">` : ""}
      <div>
        <h3>${esc(w.title)}</h3>
        <p class="desc">${esc(w.desc)}</p>
        <div class="links">${w.links.map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>
        ${cm ? `<form class="cm" data-work="${esc(w.title)}" novalidate>
          <label for="cm-text-${i}">${esc(w.title)} へのコメント</label>
          <p class="hint">気づいたこと・感想をひと言どうぞ。今岡にだけ届きます。</p>
          <textarea id="cm-text-${i}" name="text" placeholder="例：HP 版のトップ、写真の明るさが LP 版とそろっていて良い"></textarea>
          <div class="row"><input id="cm-name-${i}" name="name" placeholder="お名前（なくても送れます）" aria-label="お名前（任意）"><button type="submit">送る</button></div>
          <p class="msg" role="status" aria-live="polite"></p>
        </form>` : ""}
      </div>
    </article>`).join("")}
  </section>` : ""}

  <section>
    <h2>残っている課題 <small><span class="num">${openTasks.length}</span> 件・％は済んだ手順の割合</small></h2>
    ${openTasks.length ? `<div class="tasks">${openTasks.map(t => { const p = t.steps.length ? pct(t.steps) : 0; const wait = t.labels.includes("待ち"); return `
      <article class="task${t.status === "進行中" ? " is-now" : ""}">
        <div class="task-top"><div class="task-name">${t.status === "進行中" ? `<span class="now-tag">いま取り掛かり中</span>` : ""}${esc(t.title)}</div><div class="task-pct num">${p}<small>%</small></div></div>
        ${t.desc ? `<p class="task-desc">${esc(t.desc)}</p>` : ""}
        <div class="bar"><i style="width:${p}%"></i></div>
        <div class="task-foot">${st(t.status, wait && t.status === "未着手")}${t.steps.length ? `<span>手順 <span class="num">${t.steps.filter(x=>x[1]).length}/${t.steps.length}</span></span>` : ""}</div>
        ${t.steps.length ? `<details><summary>手順を見る</summary><ul class="steps">${t.steps.map(s => `<li class="${s[1]?"on":"off"}">${esc(s[0])}</li>`).join("")}</ul></details>` : ""}
      </article>`; }).join("")}</div>` : `<p class="empty">残っている課題はありません。</p>`}
    ${doneTasks.length ? `<h3 class="sub-h">完了した課題 <span class="num">${doneTasks.length}</span> 件</h3>
    <ul class="done-list">${doneTasks.map(t => `<li><span>${esc(t.title)}</span><span class="num">${t.closedAt ? md(t.closedAt) : ""}</span></li>`).join("")}</ul>` : ""}
  </section>

  ${fb.length ? `<section>
    <h2>${esc(fbTitle)} <small><span class="num">${fb.filter(f=>f.status==="完了").length}/${fb.length}</span> 対応済み</small></h2>
    <div class="table-box"><table>
      <thead><tr><th>指摘</th><th>状態</th><th>どう直したか</th></tr></thead>
      <tbody>${fb.map(f => `<tr><td>${esc(f.title)}</td><td>${st(f.status)}</td><td>${f.steps.map(s => esc(s[0])).join("<br>")}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>` : ""}

  <section>
    <h2>最近の動き</h2>
    ${d.log.length ? `<ul class="log">${d.log.slice(0,10).map(l => `<li><time class="num">${md(l.at)}</time><span><span class="card">${esc(l.card)}</span>${esc(l.text)}</span></li>`).join("")}</ul>` : `<p class="empty">まだありません。</p>`}
  </section>

  <footer>最終更新 <span class="num">${esc(md(d.updated))} ${esc(d.updated.slice(11,16))}</span>　作業の区切りごとに自動で更新しています。</footer>`;

  if (cm) document.querySelectorAll(".cm").forEach(f => f.addEventListener("submit", e => send(e, f, site.comment)));
}

function send(e, f, c) {
  e.preventDefault();
  const text = f.text.value.trim(), msg = f.querySelector(".msg"), btn = f.querySelector("button");
  if (!text) { msg.className = "msg err"; msg.textContent = "コメントを入れてから送ってください。"; f.text.focus(); return; }
  const body = new FormData();
  body.append(c.fields.text, text);
  if (c.fields.work) body.append(c.fields.work, f.dataset.work);
  if (c.fields.name) body.append(c.fields.name, f.name.value.trim());
  btn.disabled = true; msg.className = "msg"; msg.textContent = "送っています…";
  fetch(c.action, {method: "POST", mode: "no-cors", body})
    .then(() => { f.reset(); msg.className = "msg ok"; msg.textContent = "送りました。ありがとうございます。"; })
    .catch(() => { msg.className = "msg err"; msg.textContent = "送れませんでした。通信を確かめて、もう一度お試しください。"; })
    .finally(() => { btn.disabled = false; });
}
document.addEventListener("input", e => { if (e.target.name === "text") { const m = e.target.form?.querySelector(".msg.err"); if (m) { m.textContent = ""; m.className = "msg"; } } });

const getJSON = u => fetch(u, {cache: "no-store"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
Promise.all([getJSON("data.json"), getJSON("site.json").catch(() => null)])
  .then(([d, site]) => render(d, site))
  .catch(() => { document.getElementById("app").innerHTML = `<p class="empty">進み具合を読み込めませんでした。少し待ってから開き直してください。</p>`; });
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>課題の進み具合｜ZNENSO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@500;600&display=swap">
<style>
/* rokuma（2026-11-11 の決まり）：白い地・墨・細い横線。青は主役の数字と「見てほしい」だけ。ロゴの形は状態の印にだけ使う
   四分円（r の肩）＝章の印／丸（o）＝完了・番号／半円（k）＝進行中／点（k の点）＝見てほしい */
:root{
  --bg:#ffffff; --ink:#111214; --sub:#5e6166; --faint:#8a8d91; --line:#e4e4e0; --face:#f3f3f1;
  --accent:#2850b8; --decide:#9a6b1f; --on-ink:#ffffff;
  --jp:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  --num:Poppins,"Noto Sans JP",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141518; --ink:#ececea; --sub:#b3b5b8; --faint:#9a9da1; --line:#2e3035; --face:#1c1d21;
  --accent:#8fa8e8; --decide:#e3b56a; --on-ink:#141518; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding-block:36px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:56px}
.wrap>*{min-width:0}
.num{font-family:var(--num);font-weight:500;font-variant-numeric:tabular-nums}

/* 頭 */
.brand{display:flex;align-items:center;gap:12px;color:var(--sub);font-size:13px}
.brand b{font-family:var(--num);font-weight:600;font-size:14px;letter-spacing:.06em;color:var(--ink)}
.brand span{padding-left:12px;border-left:1px solid var(--line)}
h1{font-size:28px;line-height:1.4;margin:20px 0 10px;font-weight:700;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 24px;color:var(--sub);font-size:13.5px}
.meta b{color:var(--ink);font-weight:500}

/* 全体：面は使わず、上下の線だけ */
.overview{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;padding-block:28px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.ring{position:relative;width:128px;height:128px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .pct strong{font-family:var(--num);font-size:34px;font-weight:600;line-height:1;color:var(--accent);letter-spacing:-.01em}
.ring .pct strong small{font-size:15px;margin-left:1px}
.ring .pct span{font-size:11.5px;color:var(--sub);margin-top:6px}
.ov-body{display:grid;gap:14px}
.ov-body p{margin:0}
.counts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--sub)}
.counts .num{color:var(--ink)}

/* 状態の印（ロゴの形）。ピルは使わない */
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);white-space:nowrap}
.mk{width:9px;height:9px;flex:none;display:inline-block}
.mk-完了{border-radius:50%;background:var(--ink)}
.mk-進行中{border-radius:0 0 9px 9px;height:5px;background:var(--ink);margin-top:4px}
.mk-見てほしい{border-radius:50%;background:var(--accent);width:7px;height:7px}
.mk-未着手{border-radius:50%;border:1.5px solid var(--faint)}
.mk-待ち{border-radius:50%;border:1.5px solid var(--decide)}

/* 章の見出し：r の肩の四分円 */
h2{font-size:18px;margin:0 0 6px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
h2::before{content:"";width:12px;height:12px;border-top-left-radius:12px;background:var(--ink);flex:none}
h2 small{font-size:12.5px;color:var(--sub);font-weight:400}
.lead{margin:0 0 18px 24px;font-size:12.5px;color:var(--sub)}

/* 見てほしいこと：ページで1つだけの面。番号は墨の丸に白い数字 */
.ask{background:var(--face);padding:22px 26px}
.ask ol{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.ask li{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start}
.ask li::before{counter-increment:a;content:counter(a);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-family:var(--num);font-size:12px;font-weight:600;display:grid;place-content:center;margin-top:2px}
.ask ol{counter-reset:a}

/* 課題：箱にしない。横線で区切る */
.tasks{border-top:1px solid var(--line)}
.task{padding:20px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.task-top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline}
.task-name{font-weight:700;font-size:16px}
.task-pct{font-size:20px;font-weight:600}
.task-pct small{font-size:12px;margin-left:1px}
.task-desc{font-size:13px;color:var(--sub);margin:-4px 0 0}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--ink)}
.s-見てほしい .bar i{background:var(--accent)}
.task-foot{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;font-size:12.5px;color:var(--sub)}
details summary{cursor:pointer;color:var(--sub);font-size:12.5px;list-style:none;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
details summary::-webkit-details-marker{display:none}
details[open] summary{color:var(--ink)}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:3px;font-size:13.5px}
.steps li{display:grid;grid-template-columns:18px 1fr;align-items:center}
.steps li.off{color:var(--sub)}
.steps li::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--faint)}
.steps li.on::before{background:var(--ink);border-color:var(--ink)}

.sub-h{font-size:13px;font-weight:500;color:var(--sub);margin:28px 0 0}
.done-list{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.done-list li{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:6px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.done-list li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink)}
.done-list .num{color:var(--faint);font-size:12.5px}

/* 表：横線だけ */
.table-box{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:500px;font-size:13.5px}
th,td{text-align:left;padding:13px 16px 13px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:500;border-bottom-color:var(--ink)}
td:first-child{font-weight:500}

/* 動き */
.log{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.log li{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.log time{color:var(--faint);font-size:12.5px;padding-top:2px}
.log .card{display:block;font-size:12.5px;color:var(--sub)}
.empty{color:var(--sub);font-size:13.5px;margin:0}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--faint);border-top:1px solid var(--line);padding-top:18px}

@media (max-width:560px){
  .overview{grid-template-columns:1fr;justify-items:start;gap:22px}
  h1{font-size:23px}
  .ask{padding:18px 18px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s ease}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="empty">読み込んでいます…</p>
</div>
<script>
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = s => s.length ? Math.round(s.filter(x => x[1]).length / s.length * 100) : 0;
const jst = iso => new Date(new Date(iso).getTime() + 9 * 3600e3);
const md = iso => { const d = jst(iso); return `${d.getUTCMonth()+1}/${d.getUTCDate()}`; };
const WD = "日月火水木金土";
const ORDER = ["見てほしい","進行中","未着手","完了"];

function render(d) {
  const ms = d.milestones.filter(m => m.due).sort((a,b) => a.due.localeCompare(b.due));
  const today = jst(new Date().toISOString()); today.setUTCHours(0,0,0,0);
  const cur = ms.find(m => jst(m.due) >= today && m.open > 0) || ms[ms.length-1];
  const tasks = d.cards.filter(c => c.milestone === cur.title && c.labels.includes("課題")).sort((a,b) => a.number - b.number);
  const RANK = {"見てほしい":0,"進行中":1,"未着手":2};
  const openTasks = tasks.filter(t => t.status !== "完了").sort((a,b) => (RANK[a.status] ?? 3) - (RANK[b.status] ?? 3) || a.number - b.number);
  const doneTasks = tasks.filter(t => t.status === "完了");
  const fbMs = [...new Set(d.cards.filter(c => c.labels.includes("指摘")).map(c => c.milestone))];
  const fbTitle = fbMs[fbMs.length-1];
  const fb = d.cards.filter(c => c.labels.includes("指摘") && c.milestone === fbTitle).sort((a,b) => a.number - b.number);
  const asks = d.cards.filter(c => c.labels.includes("見てほしい") && c.status !== "完了").flatMap(c => c.bullets);

  const steps = tasks.flatMap(t => t.steps.length ? t.steps : [[t.title, t.status === "完了"]]);
  const total = pct(steps);
  const due = jst(cur.due);
  const days = Math.round((due - today) / 864e5);
  const r = 58, circ = 2 * Math.PI * r;
  const cnt = {}; tasks.forEach(t => cnt[t.status] = (cnt[t.status]||0) + 1);
  const st = (s, wait) => `<span class="st"><span class="mk mk-${wait ? "待ち" : s}"></span>${wait ? "待ち" : s}</span>`;

  document.getElementById("app").innerHTML = `
  <header>
    <div class="brand"><b>ZNENSO</b><span>課題の進み具合</span></div>
    <h1>${esc(cur.description.replace(/^課題：/, "") || cur.title)}</h1>
    <div class="meta">
      <span>次の面談 <b>${due.getUTCMonth()+1}/${due.getUTCDate()}（${WD[due.getUTCDay()]}）</b>${days >= 0 ? `　あと <b class="num">${days}</b> 日` : ""}</span>
      <span>最終更新 <b class="num">${esc(md(d.updated))} ${esc(d.updated.slice(11,16))}</b></span>
    </div>
  </header>

  <section class="overview" aria-label="全体の進み具合">
    <div class="ring">
      <svg viewBox="0 0 132 132" aria-hidden="true">
        <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/>
        <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-dasharray="${circ*total/100} ${circ}"/>
      </svg>
      <div class="pct"><strong>${total}<small>%</small></strong><span>手順の進み</span></div>
    </div>
    <div class="ov-body">
      <p>課題 <span class="num">${doneTasks.length}</span> / <span class="num">${tasks.length}</span> 件が完了。中の手順は <span class="num">${steps.filter(x=>x[1]).length}</span> / <span class="num">${steps.length}</span> 済みです。</p>
      <div class="counts">${ORDER.filter(k => cnt[k]).map(k => `<span class="st"><span class="mk mk-${k}"></span>${k} <span class="num">${cnt[k]}</span></span>`).join("")}</div>
    </div>
  </section>

  ${asks.length ? `<section>
    <h2>次の面談で見てほしいこと</h2>
    <p class="lead">今岡から、見ていただきたい所です。</p>
    <div class="ask"><ol>${asks.map(a => `<li><span>${esc(a)}</span></li>`).join("")}</ol></div>
  </section>` : ""}

  <section>
    <h2>残っている課題 <small><span class="num">${openTasks.length}</span> 件</small></h2>
    <p class="lead">％は「済んだ手順 ÷ 全部の手順」です。</p>
    ${openTasks.length ? `<div class="tasks">${openTasks.map(t => { const p = t.steps.length ? pct(t.steps) : 0; const wait = t.labels.includes("待ち"); return `
      <article class="task s-${t.status}">
        <div class="task-top"><div class="task-name">${esc(t.title)}</div><div class="task-pct num">${p}<small>%</small></div></div>
        ${t.desc ? `<p class="task-desc">${esc(t.desc)}</p>` : ""}
        <div class="bar"><i style="width:${p}%"></i></div>
        <div class="task-foot">${st(t.status, wait && t.status === "未着手")}${t.steps.length ? `<span><span class="num">${t.steps.filter(x=>x[1]).length}/${t.steps.length}</span> 手順</span>` : ""}</div>
        ${t.steps.length ? `<details><summary>手順を見る</summary><ul class="steps">${t.steps.map(s => `<li class="${s[1]?"on":"off"}">${esc(s[0])}</li>`).join("")}</ul></details>` : ""}
      </article>`; }).join("")}</div>` : `<p class="empty">残っている課題はありません。</p>`}
    ${doneTasks.length ? `<h3 class="sub-h">完了した課題 <span class="num">${doneTasks.length}</span> 件</h3>
    <ul class="done-list">${doneTasks.map(t => `<li><span>${esc(t.title)}</span><span class="num">${t.closedAt ? md(t.closedAt) : ""}</span></li>`).join("")}</ul>` : ""}
  </section>

  ${fb.length ? `<section>
    <h2>${esc(fbTitle)} <small><span class="num">${fb.filter(f=>f.status==="完了").length}/${fb.length}</span> 対応済み</small></h2>
    <p class="lead">前回いただいた指摘と、その対応です。</p>
    <div class="table-box"><table>
      <thead><tr><th>指摘</th><th>状態</th><th>どう直したか</th></tr></thead>
      <tbody>${fb.map(f => `<tr><td>${esc(f.title)}</td><td>${st(f.status)}</td><td>${f.steps.map(s => esc(s[0])).join("<br>")}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>` : ""}

  <section>
    <h2>最近の動き</h2>
    ${d.log.length ? `<ul class="log">${d.log.slice(0,12).map(l => `<li><time class="num">${md(l.at)}</time><span><span class="card">${esc(l.card)}</span>${esc(l.text)}</span></li>`).join("")}</ul>` : `<p class="empty">まだありません。</p>`}
  </section>

  <footer><span>作業の区切りごとに自動で更新しています。</span></footer>`;
}

fetch("data.json", {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => { document.getElementById("app").innerHTML = `<p class="empty">進み具合を読み込めませんでした。少し待ってから開き直してください。</p>`; });
</script>
</body>
</html>

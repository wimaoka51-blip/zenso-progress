<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>課題の進み具合｜今岡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 1列の読み物：上に全体の％、下へ課題 → 指摘 → 見てほしいこと → 動き。面談の冒頭で上から読む順 */
:root{
  --bg:#f6f7f5; --surface:#ffffff; --ink:#1d2421; --muted:#66706b; --line:#dfe3df;
  --accent:#2f5d50; --accent-soft:#e3ece8; --track:#e7ebe8;
  --done:#2f6b4f; --doing:#a8691b; --wait:#7d5ba6; --todo:#8a918d;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151a18; --surface:#1d2321; --ink:#e6ebe8; --muted:#9aa49f; --line:#2e3633;
  --accent:#8cc4b1; --accent-soft:#25332e; --track:#2a322f;
  --done:#7cc49f; --doing:#e0a75a; --wait:#b9a0dc; --todo:#8a948f; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:40px}
.wrap>*{min-width:0}
.done-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.done-list li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:11px 18px;border-bottom:1px solid var(--line);font-size:14px}
.done-list li:last-child{border-bottom:0}
.done-list li::before{content:"●";color:var(--done);font-size:11px}
.done-list .num{color:var(--muted);font-size:12.5px}
.sub{font-size:13.5px;font-weight:500;color:var(--muted);margin:22px 0 10px}
h1{font-size:26px;line-height:1.35;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:17px;margin:0 0 14px;font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
h2 small{font-size:12.5px;color:var(--muted);font-weight:400}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.head{display:grid;gap:6px}
.eyebrow{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px}
.meta b{color:var(--ink);font-weight:500}
.overview{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .pct strong{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1}
.ring .pct span{font-size:11.5px;color:var(--muted);margin-top:4px}
.ov-body{display:grid;gap:12px;min-width:0}
.ov-body p{margin:0}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.s-完了{--c:var(--done)} .s-進行中{--c:var(--doing)} .s-見てほしい{--c:var(--wait)} .s-未着手{--c:var(--todo)}
.tasks{display:grid;gap:10px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px}
.task-top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline}
.task-name{font-weight:700;min-width:0}
.task-desc{font-size:13px;color:var(--muted);margin:-4px 0 0}
.task-pct{font-size:18px;font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.task-foot{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ "}
details[open] summary::before{content:"− "}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px;font-size:13.5px}
.steps li{display:grid;grid-template-columns:20px 1fr;gap:6px}
.steps li.off{color:var(--muted)}
.steps li::before{content:"○";color:var(--todo)}
.steps li.on::before{content:"●";color:var(--done)}
.table-box{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:13.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.log time{color:var(--muted);font-size:12.5px;padding-top:2px}
.log .card{display:block;font-size:12.5px;color:var(--muted)}
.ask{background:var(--accent-soft);border-radius:10px;padding:18px 20px}
.ask ol{margin:0;padding-left:1.4em;display:grid;gap:6px}
.empty{color:var(--muted);font-size:13.5px;margin:0}
footer{font-size:12px;color:var(--muted)}
@media (max-width:560px){.overview{grid-template-columns:1fr;justify-items:start}h1{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s ease}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="empty">読み込んでいます…</p>
</div>
<script>
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = s => s.length ? Math.round(s.filter(x => x[1]).length / s.length * 100) : 0;
const jst = iso => new Date(new Date(iso).getTime() + 9 * 3600e3);
const md = iso => { const d = jst(iso); return `${d.getUTCMonth()+1}/${d.getUTCDate()}`; };
const WD = "日月火水木金土";
const ORDER = ["完了","進行中","見てほしい","未着手"];

function render(d) {
  const ms = d.milestones.filter(m => m.due).sort((a,b) => a.due.localeCompare(b.due));
  const today = jst(new Date().toISOString()); today.setUTCHours(0,0,0,0);
  const cur = ms.find(m => jst(m.due) >= today && m.open > 0) || ms[ms.length-1];
  const tasks = d.cards.filter(c => c.milestone === cur.title && c.labels.includes("課題")).sort((a,b) => a.number - b.number);
  const RANK = {"見てほしい":0,"進行中":1,"未着手":2};
  const openTasks = tasks.filter(t => t.status !== "完了").sort((a,b) => (RANK[a.status] ?? 3) - (RANK[b.status] ?? 3) || a.number - b.number);
  const doneTasks = tasks.filter(t => t.status === "完了");
  const fbMs = [...new Set(d.cards.filter(c => c.labels.includes("指摘")).map(c => c.milestone))];
  const fbTitle = fbMs[fbMs.length-1];
  const fb = d.cards.filter(c => c.labels.includes("指摘") && c.milestone === fbTitle).sort((a,b) => a.number - b.number);
  const asks = d.cards.filter(c => c.labels.includes("見てほしい") && c.status !== "完了").flatMap(c => c.bullets);

  const steps = tasks.flatMap(t => t.steps.length ? t.steps : [[t.title, t.status === "完了"]]);
  const total = pct(steps);
  const doneCards = tasks.filter(t => t.status === "完了").length;
  const due = jst(cur.due);
  const days = Math.round((due - today) / 864e5);
  const r = 56, circ = 2 * Math.PI * r;
  const cnt = {}; tasks.forEach(t => cnt[t.status] = (cnt[t.status]||0) + 1);
  const chip = s => `<span class="chip s-${s}"><span class="dot"></span>${s}</span>`;

  document.getElementById("app").innerHTML = `
  <header class="head">
    <div class="eyebrow">今岡 ・ ZNENSO 課題の進み具合</div>
    <h1>${esc(cur.description.replace(/^課題：/, "") || cur.title)}</h1>
    <div class="meta">
      <span>次の面談 <b>${due.getUTCMonth()+1}/${due.getUTCDate()}（${WD[due.getUTCDay()]}）</b>${days >= 0 ? `・あと <b class="num">${days}</b> 日` : ""}</span>
      <span>最終更新 <b class="num">${esc(md(d.updated))} ${esc(d.updated.slice(11,16))}</b></span>
    </div>
  </header>

  <section class="overview" aria-label="全体の進み具合">
    <div class="ring">
      <svg viewBox="0 0 132 132" aria-hidden="true">
        <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--track)" stroke-width="10"/>
        <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${circ*total/100} ${circ}"/>
      </svg>
      <div class="pct"><strong>${total}%</strong><span>手順の進み</span></div>
    </div>
    <div class="ov-body">
      <p>課題 <span class="num">${doneCards}</span> / <span class="num">${tasks.length}</span> 件が完了。中の手順は <span class="num">${steps.filter(x=>x[1]).length}</span> / <span class="num">${steps.length}</span> 済みです。</p>
      <div class="counts">${ORDER.filter(k => cnt[k]).map(k => `<span class="chip s-${k}"><span class="dot"></span>${k} <span class="num">${cnt[k]}</span></span>`).join("")}</div>
    </div>
  </section>

  ${asks.length ? `<section>
    <h2>次の面談で見てほしいこと</h2>
    <div class="ask"><ol>${asks.map(a => `<li>${esc(a)}</li>`).join("")}</ol></div>
  </section>` : ""}

  <section>
    <h2>残っている課題 <small><span class="num">${openTasks.length}</span> 件・％は「済んだ手順 ÷ 全部の手順」</small></h2>
    ${openTasks.length ? "" : `<p class="empty">残っている課題はありません。</p>`}
    <div class="tasks">${openTasks.map(t => { const p = t.steps.length ? pct(t.steps) : (t.status === "完了" ? 100 : 0); return `
      <article class="task s-${t.status}">
        <div class="task-top"><div class="task-name">${esc(t.title)}</div><div class="task-pct num">${p}%</div></div>
        ${t.desc ? `<p class="task-desc">${esc(t.desc)}</p>` : ""}
        <div class="bar"><i style="width:${p}%"></i></div>
        <div class="task-foot">${chip(t.status)}${t.steps.length ? `<span class="num">${t.steps.filter(x=>x[1]).length}/${t.steps.length} 手順</span>` : ""}</div>
        ${t.steps.length ? `<details><summary>手順を見る</summary><ul class="steps">${t.steps.map(s => `<li class="${s[1]?"on":"off"}">${esc(s[0])}</li>`).join("")}</ul></details>` : ""}
      </article>`; }).join("")}</div>
    ${doneTasks.length ? `<h3 class="sub">完了した課題 <span class="num">${doneTasks.length}</span> 件</h3>
    <ul class="done-list">${doneTasks.map(t => `<li><span>${esc(t.title)}</span><span class="num">${t.closedAt ? md(t.closedAt) : ""}</span></li>`).join("")}</ul>` : ""}
  </section>

  ${fb.length ? `<section>
    <h2>${esc(fbTitle)} <small><span class="num">${fb.filter(f=>f.status==="完了").length}/${fb.length}</span> 対応済み</small></h2>
    <div class="table-box"><table>
      <thead><tr><th>指摘</th><th>状態</th><th>どう直したか</th></tr></thead>
      <tbody>${fb.map(f => `<tr><td>${esc(f.title)}</td><td>${chip(f.status)}</td><td>${f.steps.map(s => esc(s[0])).join("<br>")}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>` : ""}

  <section>
    <h2>最近の動き</h2>
    ${d.log.length ? `<ul class="log">${d.log.slice(0,12).map(l => `<li><time class="num">${md(l.at)}</time><span><span class="card">${esc(l.card)}</span>${esc(l.text)}</span></li>`).join("")}</ul>` : `<p class="empty">まだありません。</p>`}
  </section>

  <footer>作業の区切りごとに自動で更新しています。</footer>`;
}

fetch("data.json", {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => { document.getElementById("app").innerHTML = `<p class="empty">進み具合を読み込めませんでした。少し待ってから開き直してください。</p>`; });
</script>
</body>
</html>
